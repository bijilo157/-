<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Fight Announcement System</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-blue: #5391e5;
    --bg-blue: #8ca6c4;
    --input-bg: #f9f9f9;
    --text-muted: #99a5b5;
    --white: #ffffff;
    --grad: linear-gradient(90deg, #6a82fb, #fc5c7d);
    --pastel-blue: #eef2ff;
  }

  body {
    font-family: 'Kanit', sans-serif;
    background: var(--bg-blue);
    margin: 0; padding: 20px;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }

  .container {
    background: var(--white);
    width: 100%;
    max-width: 500px;
    min-height: 550px;
    border-radius: 50px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    padding: 50px 40px;
    text-align: center;
    position: relative;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  .container.app-mode { 
    max-width: 750px; 
    min-height: 900px; 
  }

  .logout-corner {
    position: absolute; top: 30px; right: 35px;
    background: #ffeded; color: #ff5c5c; border: none;
    padding: 6px 14px; border-radius: 12px;
    font-weight: 600; font-size: 11px; cursor: pointer; z-index: 10;
  }

  .auth-title { color: var(--text-muted); font-size: 14px; letter-spacing: 2px; font-weight: 700; margin-bottom: 40px; text-transform: uppercase; }

  .custom-input {
    width: 100%; background: var(--input-bg); border: 1.5px solid #eee;
    border-radius: 25px; padding: 18px; font-size: 16px; text-align: center;
    box-sizing: border-box; outline: none; margin-bottom: 15px; font-family: 'Kanit'; color: #555;
  }

  .btn-auth {
    background: var(--primary-blue); color: white; border: none; border-radius: 25px;
    padding: 16px 0; width: 100%; font-size: 18px; font-weight: 700;
    cursor: pointer; margin-top: 15px; box-shadow: 0 8px 20px rgba(83, 145, 229, 0.3);
  }

  .auth-switch-group {
    margin-top: 20px; display: flex; justify-content: center; gap: 15px; font-size: 13px;
  }
  .auth-switch { color: var(--primary-blue); cursor: pointer; text-decoration: underline; }

  .nav-tabs { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
  .nav-tabs button {
    background: #e6eaff; border: none; padding: 10px 22px; border-radius: 15px;
    font-weight: 600; color: #5391e5; cursor: pointer; font-size: 14px;
  }
  .nav-tabs button.active { background: var(--primary-blue); color: white; }

  .admin-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
  .admin-menu-btn {
    background: #f8faff; border: 1px solid #edf2f7; padding: 10px 15px;
    border-radius: 15px; font-size: 13px; font-weight: 600; color: #718096;
    cursor: pointer; transition: 0.3s;
  }
  .admin-menu-btn.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); box-shadow: 0 4px 12px rgba(83, 145, 229, 0.3); }

  .admin-card {
    background: #ffffff; border-radius: 25px; padding: 25px;
    border: 1px solid #f0f4f8; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.02);
    min-height: 400px;
  }
  
  .admin-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
  .admin-input-small { 
    flex: 1; padding: 12px 18px; border-radius: 15px; border: 1.5px solid #edf2f7; 
    font-family: 'Kanit'; outline: none; font-size: 14px; background: #fdfdfd;
  }
  .btn-add { background: var(--primary-blue); color: white; border: none; border-radius: 15px; padding: 0 20px; cursor: pointer; font-weight: 700; }

  .tag-container { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag { 
    background: #f0f4ff; color: #5391e5; padding: 8px 15px; border-radius: 12px; 
    font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .tag span { cursor: pointer; color: #ff8585; font-size: 16px; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th { background: #f8faff; color: #718096; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #edf2f7; }
  td { padding: 12px; border-bottom: 1px solid #f7fafc; color: #4a5568; vertical-align: top; }

  .role-checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .role-item { display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .role-item input { cursor: pointer; width: 14px; height: 14px; }
  .role-item.disabled { opacity: 0.5; cursor: not-allowed; }
  .role-item.disabled input { cursor: not-allowed; }

  .btn-delete { background: #fff5f5; color: #f56565; border: none; padding: 6px 10px; border-radius: 10px; cursor: pointer; font-size: 11px; font-weight: 600; }

  .form-label { display: block; text-align: left; font-size: 13px; font-weight: 700; color: #333; margin: 10px 0 5px 15px; }
  .app-select { width: 100%; padding: 12px 20px; border-radius: 15px; border: 1.5px solid #b0c4ff; background: #fff; margin-bottom: 12px; font-family: 'Kanit'; outline: none; font-size: 14px; box-sizing: border-box; }
  .btn-gradient { background: var(--grad); color: white; border: none; border-radius: 18px; padding: 14px; width: 100%; font-weight: 700; font-size: 16px; cursor: pointer; margin: 10px 0; transition: background 0.3s; }
  .btn-copy-success { background: #48bb78 !important; }
  #preview-box { background: #f0f4ff; border-radius: 20px; padding: 20px; min-height: 100px; text-align: left; font-size: 14px; white-space: pre-wrap; margin-top: 10px; }
  
  .page { flex: 1; display: flex; flex-direction: column; }
  #historyList { flex: 1; overflow-y: auto; max-height: 600px; padding-right: 5px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container" id="mainBox">
  <button id="btnLogout" class="logout-corner hidden" onclick="logout()">LOGOUT</button>

  <div id="sectionAuth">
    <div id="authHeader" class="auth-title">LOGIN</div>
    
    <div id="authInputs">
      <input type="text" id="authUser" class="custom-input" placeholder="ใส่ชื่อของคุณ">
      <input type="password" id="authPass" class="custom-input" placeholder="ใส่รหัส PIN">
    </div>

    <div id="resetInputs" class="hidden">
      <input type="password" id="newPinAuth" class="custom-input" placeholder="รหัส PIN ใหม่">
    </div>

    <button id="btnAuthMain" class="btn-auth" onclick="handleAuth()">เข้าสู่ระบบ</button>
    
    <div class="auth-switch-group">
      <div id="switchReg" class="auth-switch" onclick="setAuthMode('register')">ลงทะเบียนสมาชิก</div>
      <div id="switchReset" class="auth-switch" onclick="setAuthMode('reset')">เปลี่ยนรหัส PIN</div>
      <div id="switchLogin" class="auth-switch hidden" onclick="setAuthMode('login')">ย้อนกลับ</div>
    </div>
  </div>

  <div id="sectionApp" class="hidden">
    <div class="nav-tabs">
      <button id="tabCreate" class="active" onclick="showPage('create')">📝 สร้างประกาศ</button>
      <button id="tabHistory" onclick="showPage('history')">📜 บันทึก</button>
      <button id="tabAdmin" onclick="showPage('admin')">⚙️ จัดการระบบ</button>
    </div>

    <div id="pageCreate" class="page">
      <div style="display:flex; gap:10px;">
        <div style="flex:1">
          <span class="form-label">แก๊ง 1</span>
          <select id="f1" class="app-select"></select>
        </div>
        <div style="flex:1">
          <span class="form-label">แก๊ง 2</span>
          <select id="f2" class="app-select"></select>
        </div>
      </div>
      
      <span class="form-label">สินเดิมพัน</span>
      <div style="display:flex; gap:10px;">
        <input type="text" id="bet" class="app-select" style="flex:2" placeholder="เช่น 5">
        <select id="unit" class="app-select" style="flex:1">
          <option value="1">หน่วย</option>
          <option value="10">สิบ</option>
          <option value="100">ร้อย</option>
          <option value="1000">พัน</option>
          <option value="10000">หมื่น</option>
          <option value="100000">แสน</option>
          <option value="1000000" selected>ล้าน</option>
        </select>
      </div>
      
      <div style="display:flex; gap:10px;">
        <div style="flex:1">
          <span class="form-label">จำนวนไฟต์</span>
          <input type="text" id="rnd" class="app-select" value="1">
        </div>
        <div style="flex:1">
          <span class="form-label">คูลดาวน์หมอ</span>
          <input type="text" id="cd" class="app-select" value="1">
        </div>
      </div>

      <span class="form-label">สถานที่</span>
      <select id="loc" class="app-select"></select>

      <span class="form-label">เพิ่มเติม</span>
      <input type="text" id="more" class="app-select" value="พร้อมนั่ง ไม่กักพุง">
      
      <span class="form-label">วอ</span>
      <input type="text" id="radio" class="app-select" value="85">

      <button class="btn-gradient" onclick="createMsg()">สร้างข้อความประกาศ</button>
      <div id="preview-box"></div>
      <button id="btnCopy" class="btn-gradient" onclick="copyText()">💗 คัดลอกข้อความ</button>
    </div>

    <div id="pageHistory" class="page hidden">
      <div id="historyList"></div>
    </div>

    <div id="pageAdmin" class="page hidden">
      <div class="admin-menu">
        <div class="admin-menu-btn active" id="subTabUser" onclick="showSubAdmin('User')">👤 สมาชิก</div>
        <div class="admin-menu-btn" id="subTabGang" onclick="showSubAdmin('Gang')">🏠 แก๊ง</div>
        <div class="admin-menu-btn" id="subTabLoc" onclick="showSubAdmin('Loc')">📍 สถานที่</div>
      </div>

      <div id="subPageUser" class="admin-card sub-page">
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>NAME</th><th>ROLES</th><th>ACTION</th></tr></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="subPageGang" class="admin-card sub-page hidden">
        <div class="admin-input-group">
          <input type="text" id="newGangName" class="admin-input-small" placeholder="ชื่อแก๊งใหม่...">
          <button class="btn-add" onclick="addItem('gang')">เพิ่ม</button>
        </div>
        <div id="gangTags" class="tag-container"></div>
      </div>

      <div id="subPageLoc" class="admin-card sub-page hidden">
        <div class="admin-input-group">
          <input type="text" id="newLocName" class="admin-input-small" placeholder="ชื่อสถานที่ใหม่...">
          <button class="btn-add" onclick="addItem('loc')">เพิ่ม</button>
        </div>
        <div id="locTags" class="tag-container"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAEPuJxADueJko9C9LN9OUoVkPI3WNaMo",
    authDomain: "tsts-4888b.firebaseapp.com",
    databaseURL: "https://tsts-4888b-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tsts-4888b",
    storageBucket: "tsts-4888b.firebasestorage.app",
    messagingSenderId: "123650706135",
    appId: "1:123650706135:web:d1925f41c3a38a8232be92",
    measurementId: "G-71JEJMJ2MR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let users = {};
  let gangs = [];
  let locs = [];
  let historyData = [];
  let currentUser = null;
  let currentUserID = null;
  let authMode = 'login';

  const ALL_ROLES = [
    {id: 'owner', label: 'Owner'},
    {id: 'admin', label: 'แอดมิน'},
    {id: 'manager', label: 'ผู้จัดการ'},
    {id: 'editor', label: 'เขียนข่าว'},
    {id: 'guest', label: 'ทั่วไป'}
  ];

  function sortThaiEnglish(array) {
    if(!array) return [];
    return [...array].sort((a, b) => {
      return a.localeCompare(b, 'th', { sensitivity: 'base', numeric: true });
    });
  }

  onValue(ref(db, 'users'), (snapshot) => {
    users = snapshot.val() || {};
    const hasJaokha = Object.values(users).some(u => u.user === 'Jaokha');
    if(!hasJaokha) { set(ref(db, 'users/master'), {user: 'Jaokha', pass: '9988', roles: ['owner']}); }
    renderAdmin();
  });

  onValue(ref(db, 'gangs'), (snapshot) => {
    let rawGangs = snapshot.val();
    gangs = sortThaiEnglish(rawGangs || []); 
    renderOptions();
    renderAdmin();
  });

  onValue(ref(db, 'locs'), (snapshot) => {
    let rawLocs = snapshot.val();
    locs = sortThaiEnglish(rawLocs || []);
    renderOptions();
    renderAdmin();
  });

  onValue(ref(db, 'history'), (snapshot) => {
    const data = snapshot.val() || {};
    historyData = Object.keys(data).map(key => ({id: key, ...data[key]})).reverse();
    renderHistory();
  });

  window.setAuthMode = function(mode) {
    authMode = mode;
    const header = document.getElementById('authHeader');
    const btn = document.getElementById('btnAuthMain');
    const authInputs = document.getElementById('authInputs');
    const authPassInput = document.getElementById('authPass');
    const resetInputs = document.getElementById('resetInputs');
    
    authInputs.classList.add('hidden');
    authPassInput.classList.remove('hidden');
    resetInputs.classList.add('hidden');
    document.getElementById('switchReg').classList.add('hidden');
    document.getElementById('switchReset').classList.add('hidden');
    document.getElementById('switchLogin').classList.remove('hidden');

    if(mode === 'login') {
      header.innerText = 'LOGIN';
      btn.innerText = 'เข้าสู่ระบบ';
      authInputs.classList.remove('hidden');
      document.getElementById('switchReg').classList.remove('hidden');
      document.getElementById('switchReset').classList.remove('hidden');
      document.getElementById('switchLogin').classList.add('hidden');
    } else if(mode === 'register') {
      header.innerText = 'REGISTER';
      btn.innerText = 'สมัครสมาชิก';
      authInputs.classList.remove('hidden');
    } else if(mode === 'reset') {
      header.innerText = 'RESET PIN';
      btn.innerText = 'ยืนยันการเปลี่ยน';
      authInputs.classList.remove('hidden');
      authPassInput.classList.add('hidden');
      resetInputs.classList.remove('hidden');
    }
  };

  window.handleAuth = function() {
    const u = document.getElementById('authUser').value.trim();
    const p = document.getElementById('authPass').value.trim();
    if(!u) return alert("กรุณากรอกชื่อผู้ใช้");

    const userEntry = Object.entries(users).find(([id, data]) => data.user === u);

    if(authMode === 'login') {
      if(!p) return alert("กรุณากรอกรหัส PIN");
      if(userEntry && userEntry[1].pass === p) {
        currentUserID = userEntry[0];
        currentUser = userEntry[1];
        sessionStorage.setItem('logged_user_id', currentUserID);
        startApp();
      } else { alert("ชื่อหรือ PIN ไม่ถูกต้อง"); }
    } else if(authMode === 'register') {
      if(!p) return alert("กรุณากรอกรหัส PIN");
      if(userEntry) return alert("ชื่อนี้ถูกใช้ไปแล้ว");
      const newUserRef = push(ref(db, 'users'));
      set(newUserRef, { user: u, pass: p, roles: ['guest'] }).then(() => {
        alert("ลงทะเบียนสำเร็จ! กรุณาเข้าสู่ระบบ");
        setAuthMode('login');
      });
    } else if(authMode === 'reset') {
      const newP = document.getElementById('newPinAuth').value.trim();
      if(!newP) return alert("กรุณากรอก PIN ใหม่");
      if(userEntry) {
        update(ref(db, `users/${userEntry[0]}`), { pass: newP }).then(() => {
          alert("เปลี่ยนรหัสผ่านสำเร็จ!");
          setAuthMode('login');
        });
      } else { alert("ไม่พบชื่อผู้ใช้งานนี้ในระบบ"); }
    }
  };

  function startApp() {
    document.getElementById('sectionAuth').classList.add('hidden');
    document.getElementById('sectionApp').classList.remove('hidden');
    document.getElementById('btnLogout').classList.remove('hidden');
    document.getElementById('mainBox').classList.add('app-mode');
    renderOptions();
    showPage('create');
  }

  window.logout = function() { sessionStorage.clear(); location.reload(); };

  window.showPage = function(p) {
    document.querySelectorAll('.page').forEach(pg => pg.classList.add('hidden'));
    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('page' + p.charAt(0).toUpperCase() + p.slice(1)).classList.remove('hidden');
    document.getElementById('tab' + p.charAt(0).toUpperCase() + p.slice(1)).classList.add('active');
    if(p === 'admin') showSubAdmin('User');
  };

  window.showSubAdmin = function(sub) {
    document.querySelectorAll('.sub-page').forEach(sp => sp.classList.add('hidden'));
    document.querySelectorAll('.admin-menu-btn').forEach(sm => sm.classList.remove('active'));
    document.getElementById('subPage' + sub).classList.remove('hidden');
    document.getElementById('subTab' + sub).classList.add('active');
    renderAdmin();
  };

  function renderOptions() {
    const gHtml = gangs.map(g => `<option value="${g}">${g}</option>`).join('');
    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    const lc = document.getElementById('loc');
    if(f1) f1.innerHTML = gHtml; 
    if(f2) f2.innerHTML = gHtml;
    if(lc) lc.innerHTML = locs.map(l => `<option value="${l}">${l}</option>`).join('');
  }

  window.addItem = function(type) {
    const input = document.getElementById(type === 'gang' ? 'newGangName' : 'newLocName');
    const val = input.value.trim();
    if(!val) return;
    const targetRef = ref(db, type === 'gang' ? 'gangs' : 'locs');
    const currentData = type === 'gang' ? gangs : locs;
    const newData = [...currentData, val];
    set(targetRef, sortThaiEnglish(newData));
    input.value = '';
  };

  window.removeItem = function(type, index) {
    const targetRef = ref(db, type === 'gang' ? 'gangs' : 'locs');
    const data = type === 'gang' ? [...gangs] : [...locs];
    data.splice(index, 1);
    set(targetRef, data.length > 0 ? data : null);
  };

  function renderAdmin() {
    const gangTags = document.getElementById('gangTags');
    const locTags = document.getElementById('locTags');
    if(gangTags) gangTags.innerHTML = gangs.map((g, i) => `<div class="tag">${g}<span onclick="removeItem('gang', ${i})">×</span></div>`).join('');
    if(locTags) locTags.innerHTML = locs.map((l, i) => `<div class="tag">${l}<span onclick="removeItem('loc', ${i})">×</span></div>`).join('');
    
    const body = document.getElementById('userTableBody'); 
    if(!body) return;
    body.innerHTML = '';
    
    const sortedUserEntries = Object.entries(users).sort((a, b) => a[1].user.localeCompare(b[1].user, 'th'));

    sortedUserEntries.forEach(([key, u]) => {
      if (u.user === 'Jaokha') return;
      const tr = document.createElement('tr');
      let rolesHtml = `<div class="role-checkbox-group">`;
      ALL_ROLES.forEach(roleDef => {
        const checked = u.roles && u.roles.includes(roleDef.id) ? 'checked' : '';
        const isDisabled = (roleDef.id === 'owner') ? 'disabled' : '';
        rolesHtml += `<label class="role-item ${isDisabled}"><input type="checkbox" ${checked} ${isDisabled} onchange="updateMultiRole('${key}', '${roleDef.id}', this.checked)"> ${roleDef.label}</label>`;
      });
      rolesHtml += `</div>`;
      tr.innerHTML = `<td><strong>${u.user}</strong></td><td>${rolesHtml}</td><td><button class="btn-delete" onclick="delUser('${key}')">ลบ</button></td>`;
      body.appendChild(tr);
    });
  }

  window.updateMultiRole = function(userKey, roleId, checked) {
    let userRoles = users[userKey].roles || [];
    if(checked) { if(!userRoles.includes(roleId)) userRoles.push(roleId); }
    else { userRoles = userRoles.filter(r => r !== roleId); }
    if(userRoles.length === 0) userRoles = ['guest'];
    update(ref(db, `users/${userKey}`), { roles: userRoles });
  };

  window.delUser = function(key) { if(confirm("ลบสมาชิกนี้?")) { remove(ref(db, `users/${key}`)); } };

  window.createMsg = function() {
    const rawBetInput = document.getElementById('bet').value.trim();
    const unitMultiplier = parseInt(document.getElementById('unit').value);
    
    let betPart = rawBetInput;
    let extraPart = "";
    if (rawBetInput.includes("+")) {
      const parts = rawBetInput.split("+");
      betPart = parts[0].trim();
      extraPart = " + " + parts.slice(1).join("+").trim();
    }

    const totalBetNum = parseFloat(betPart) * unitMultiplier;
    const totalBetStr = isNaN(totalBetNum) ? betPart : totalBetNum.toLocaleString();
    
    let unitLabel = "";
    if (unitMultiplier === 1000000) unitLabel = "M";
    else if (unitMultiplier === 100000) unitLabel = "K";
    
    const finalBetDisplay = `${totalBetStr}${unitLabel}${extraPart}`;
    
    // ปรับรูปแบบข้อความประกาศ: เว้นวรรคหน้าเครื่องหมาย : ตามต้องการ
    const msg = `${document.getElementById('f1').value} Vs ${document.getElementById('f2').value}\nสินเดิมพัน : ${finalBetDisplay}\nจำนวนไฟต์ : ${document.getElementById('rnd').value} ไฟต์\nคูลดาวน์หมอ : ${document.getElementById('cd').value} นาที\nสถานที่ : ${document.getElementById('loc').value}\nเพิ่มเติม : ${document.getElementById('more').value}\nวอ : ${document.getElementById('radio').value}\n<@651025174338076683> <@537589376096665601>`;
    
    document.getElementById('preview-box').innerText = msg;
    const now = new Date();
    const timeStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH');
    push(ref(db, 'history'), { text: msg, author: currentUser.user, time: timeStr });

    copyText();
  };

  window.copyText = function() { 
    const previewText = document.getElementById('preview-box').innerText;
    if(!previewText) return;
    navigator.clipboard.writeText(previewText).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.classList.add('btn-copy-success');
      btn.innerText = "✅ คัดลอกสำเร็จ!";
      setTimeout(() => { btn.classList.remove('btn-copy-success'); btn.innerText = "💗 คัดลอกข้อความ"; }, 2000);
    }); 
  };

  function renderHistory() {
    const list = document.getElementById('historyList'); 
    if(!list) return;
    list.innerHTML = '';
    historyData.forEach(item => {
      const card = document.createElement('div');
      card.style = "background:#f8faff; padding:15px; border-radius:15px; margin-bottom:10px; text-align:left; border-left:5px solid #5391e5; position:relative;";
      card.innerHTML = `<div style="margin-bottom:8px;"><strong style="color:var(--primary-blue); font-size:14px;">📢 ประกาศโดย: ${item.author}</strong> <br><small style="color:#999;">เมื่อ: ${item.time}</small></div>
                        <div style="font-size:14px; color:#444; white-space:pre-wrap;">${item.text}</div>
                        <button class="btn-delete" style="position:absolute; right:10px; top:10px;" onclick="delHistory('${item.id}')">ลบ</button>`;
      list.appendChild(card);
    });
  }

  window.delHistory = function(id) { if(confirm("ลบประวัตินี้?")) { remove(ref(db, `history/${id}`)); } };

  const savedID = sessionStorage.getItem('logged_user_id');
  if(savedID) {
    onValue(ref(db, `users/${savedID}`), (snap) => {
      if(snap.exists()) {
        currentUserID = savedID;
        currentUser = snap.val();
        startApp();
      }
    }, { onlyOnce: true });
  }
</script>
</body>
</html>
